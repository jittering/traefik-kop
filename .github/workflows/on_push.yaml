name: on-push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_docker:
    name: Build Docker
    uses: ./.github/workflows/build.yaml
    with:
      fetch-depth: 0
      push-docker-images: true
    secrets: inherit
